[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-agent"
version = "0.1.0"
description = "A LangGraph customer support agent with policy RAG and memory interfaces"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-deepseek>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.1,<2",
    "argon2-cffi>=23.1,<26",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.18,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.scripts]
customer-agent = "customer_agent.main:run"
customer-agent-import-policies = "customer_agent.import_policies:main"
